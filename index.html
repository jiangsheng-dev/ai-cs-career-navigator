function hard(it){return it.lv==='顶级'||it.lv==='硬通货';}
function match(it,termOverride){

if(term!=='全部'&&termsOf(it).indexOf(term)<0){return false;}
if(state.type==='硬'){if(!hard(it)){return false;}}

if(state.dir!=='全部'&&it.d!==state.dir){return false;}
if(state.q){var hay=(it.n+' '+it.w+' '+it.d+' '+it.lv+' '+(it.ef||'')).toLowerCase();if(hay.indexOf(state.q)<0){return false;}}

}
function zsbOf(prov){return ZSB_PROV[prov]||ZSB_DEFAULT;}
function pvKey(it){
if(it.n.indexOf('专升本 备考')===0){return 'prep';}
if(it.n.indexOf('专升本 考试')===0){return 'exam';}
return '';

function monthRange(list){
var s=list.slice().sort(function(a,b){return ((a+3)%12)-((b+3)%12);});

}
function ncreOf(prov){return NCRE_PROV[prov]||NCRE_PROV['全国'];}

var n=ncreOf(prov),out=[];
n.m3.forEach(function(m){out.push([m,'报名']);});
out.push([3,'考试']);
n.m9.forEach(function(m){out.push([m,'报名']);});
out.push([9,'考试']);
return out;
}
function softOf(prov){return SOFT_PROV[prov]||null;}
function isSoft(it){return it.n.indexOf('软考')===0;}
function softMo(prov){
var s=softOf(prov);
if(!s){return null;}
var out=[[3,'报名'],[4,'报名'],[5,'考试']];
s.m.forEach(function(m){out.push([m,'报名']);});
out.push([11,'考试']);
return out;
}
function effMo(it){
if(isNcre(it)&&state.prov!=='全国'){return ncreMo(state.prov);}
if(isSoft(it)&&state.prov!=='全国'){var sm=softMo(state.prov);if(sm){return sm;}}
var k=pvKey(it);
if(!k){return it.mo||[];}
var z=zsbOf(state.prov),out=[],i;
if(k==='prep'){
var first=Math.min.apply(null,z.s);
for(i=4;i>=1;i--){out.push([((first-1-i+12)%12)+1,'备赛','备考']);}
z.s.forEach(function(m){out.push([m,'报名']);});
return out;
}
z.e.forEach(function(m){out.push([m,'考试']);});
(z.r||[]).forEach(function(m){out.push([m,'结果','录取']);});
return out;
}

function detailOf(it){
var best=null,bk='';
for(var k in DETAILS){if(it.n.indexOf(k)===0&&k.length>bk.length){bk=k;best=DETAILS[k];}}
return best;
}
function stars(n){var s='',i;if(!n){return '暂无评级';}for(i=1;i<=5;i++){s+=(i<=n?'★':'☆');}return s;}
function signupRange(it){
var mo=effMo(it),ms=[];
mo.forEach(function(p){if(p[1]==='报名'&&ms.indexOf(p[0])<0){ms.push(p[0]);}});
if(isNcre(it)&&state.prov!=='全国'){var n=ncreOf(state.prov);return '3 月场 '+n.d3+'；9 月场 '+n.d9;}
if(isSoft(it)&&state.prov!=='全国'){var sf=softOf(state.prov);if(sf){return '上半年 '+SOFT_UP+'；下半年 2026 年 '+sf.d;}}
if(pvKey(it)&&state.prov!=='全国'){var z=zsbOf(state.prov);return monthRange(z.s)+'报名、'+monthRange(z.e)+'考试（'+state.prov+'往年安排）';}
if(ms.length){return monthRange(ms)+'（往年惯例，具体看当年通知）';}
return '全年滚动 / 见官方通知';
}
function roundsFromMo(it){
var out=[];
effMo(it).forEach(function(p){if(p[1]==='比赛'||p[1]==='考试'){out.push(p[0]+'月'+(p[2]||p[1]));}});
return out.length?out.join(' → '):'见官方通知';
}

function renderLanes(){
var host=document.getElementById('db-lanes');
if(!host){return;}
host.textContent='';
var shown=0;
var laneTerms=(state.term==='全部')?TERMS:TERMS.filter(function(x){return x[0]===state.term;});
laneTerms.forEach(function(t){
var idx=[];
CS_DATA.forEach(function(it,i){
if(termsOf(it).indexOf(t[0])<0){return;}
if(!match(it)){return;}
if(state.hideDone&&isDone(i)){return;}
idx.push(i);
});
if(!idx.length){return;}
if(cet4Done()){
var pa=idx.indexOf(CET4_IDX),pb=idx.indexOf(CET6_IDX);
if(pa>=0&&pb>=0&&pb!==pa+1){idx.splice(pb,1);idx.splice(pa+1,0,CET6_IDX);}
}
shown+=idx.length;
var lane=elm('section','db-lane');
var hd=elm('div','db-lane-hd');
hd.appendChild(elm('h4','db-lane-title',t[0]));
hd.appendChild(elm('span','db-lane-count',idx.length+' 项'));
lane.appendChild(hd);
lane.appendChild(elm('p','db-lane-sub',t[1]));
idx.forEach(function(i,n){
if(n>0){lane.appendChild(document.createElement('hr'));}
lane.appendChild(itemNode(CS_DATA[i],i));
});
host.appendChild(lane);
});
if(!shown){host.appendChild(elm('p','db-empty','当前筛选下没有条目，换个条件试试。'));}
refreshIcons();
}

effMo(it).forEach(function(p){

function copyText(txt,btn){
function done(){var old=btn.textContent;btn.textContent='已复制';setTimeout(function(){btn.textContent=old;},1500);}
function fallback(){
var ta=document.createElement('textarea');
ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.select();
try{document.execCommand('copy');done();}catch(e){btn.textContent='复制失败';}
document.body.removeChild(ta);
}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}else{fallback();}
}

<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );

o=o.replace(/^#{1,6}\s*/gm,'');
o=o.replace(/\*\*([^*\n]+)\*\*/g,'$1');
o=o.replace(/__([^_\n]+)__/g,'$1');
o=o.replace(/`([^`\n]+)`/g,'$1');
o=o.replace(/^\s*>\s?/gm,'');
o=o.replace(/^\s*[-*+]\s+/gm,'· ');
o=o.replace(/^\s*---+\s*$/gm,'');
o=o.replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g,'$1（$2）');
o=o.replace(/\*\*/g,'');
return o;
}

function sendMsg(){
var text=(ta.value||'').trim();
if(!text||cur.bot<0){return;}
var sys={role:'system',content:AGENTS[cur.bot].prompt+'\n\n回答要求：用中文，控制在 300 字以内；先给结论和可执行步骤；代码只给关键片段，不要重复我的问题。不要使用 Markdown 格式（不要出现 **、#、代码围栏、表格、- 列表等标记），用纯文本自然分段，需要列举时写 1. 2. 3.。'};
if(cfg.mode==='webllm'){
if(!localEngine){setPanel.hidden=false;setOpen(true);applyMode();hint.textContent='内置模型还在加载，请稍候再发';return;}
ta.value='';
cur.history.push({role:'user',content:text});
bubble('user',text);
var lp=bubble('assistant','正在思考…');
sendBtn.disabled=true;
hint.textContent='本机生成中（流式输出）…';
localEngine.chat.completions.create({
messages:[sys].concat(cur.history.slice(-8)),
temperature:0.6,
stream:true,
max_tokens:2048
}).then(function(chunks){
var acc='',it=chunks[Symbol.asyncIterator](),fr='';
function pump(){
return it.next().then(function(res){
if(res.done){
var plain=stripMd(acc);
if(fr==='length'){plain+='\n\n（回答达到输出上限，输入「继续」可接着写）';}
lp.textContent=plain||'(模型没有返回内容)';
if(acc){cur.history.push({role:'assistant',content:stripMd(acc)});}
updateHint();msgs.scrollTop=msgs.scrollHeight;
return;
}
var c=res.value;
var ch=c&&c.choices&&c.choices[0];
if(ch&&ch.finish_reason){fr=ch.finish_reason;}
var d=ch&&ch.delta&&ch.delta.content;
if(d){acc+=d;lp.textContent=stripMd(acc);msgs.scrollTop=msgs.scrollHeight;}
return pump();
});
}
return pump();
}).catch(function(err){
lp.textContent='本地模型出错：'+((err&&err.message)?err.message:err);
hint.textContent='生成失败，可换 0.5B 模型或切到 API 模型';
}).then(function(){sendBtn.disabled=false;});
return;
}
if(!cfg.baseUrl||!cfg.apiModel||(!cfg.apiKey&&!/localhost|127\.0\.0\.1/.test(cfg.baseUrl))){
setPanel.hidden=false;setOpen(true);applyMode();
hint.textContent='请先在 API 模型里填写 Key 并保存';
keyInp.focus();
return;
}
ta.value='';
cur.history.push({role:'user',content:text});
bubble('user',text);
var pending=bubble('assistant','正在思考…');
hint.textContent='请求中（流式输出）…';
sendBtn.disabled=true;
var acc2='';
fetch(cfg.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+(cfg.apiKey||'ollama')},
body:JSON.stringify({model:cfg.apiModel,messages:[sys].concat(cur.history.slice(-8)),temperature:0.6,stream:true,max_tokens:2048})
}).then(function(r){
if(!r.ok){return r.text().then(function(txt){throw new Error('HTTP '+r.status+' · '+txt.slice(0,300));});}
if(!r.body||!r.body.getReader){
return r.text().then(function(txt){
var data=JSON.parse(txt);
var out=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'(模型没有返回内容)';
var fr3=data.choices&&data.choices[0]&&data.choices[0].finish_reason;acc2=out;pending.textContent=stripMd(out)+(fr3==='length'?'\n\n（回答达到输出上限，输入「继续」可接着写）':'');cur.history.push({role:'assistant',content:stripMd(out)});
});
}
var reader=r.body.getReader(),dec=new TextDecoder(),buf='',fr2='';
function pump(){
return reader.read().then(function(res){
if(res.done){
if(acc2){
var plain2=stripMd(acc2);
if(fr2==='length'){plain2+='\n\n（回答达到输出上限，输入「继续」可接着写）';}
pending.textContent=plain2;
cur.history.push({role:'assistant',content:stripMd(acc2)});
}else{pending.textContent='(模型没有返回内容)';}
updateHint();msgs.scrollTop=msgs.scrollHeight;
return;
}
buf+=dec.decode(res.value,{stream:true});
var lines=buf.split('\n');
buf=lines.pop();
lines.forEach(function(line){
line=line.replace(/\r$/,'').trim();
if(!line||line.indexOf('data:')!==0){return;}
var data=line.slice(5).trim();
if(data==='[DONE]'){return;}
try{
var j=JSON.parse(data);
var ch=j.choices&&j.choices[0];
if(ch&&ch.finish_reason){fr2=ch.finish_reason;}
var d=ch&&ch.delta&&ch.delta.content;
if(d){acc2+=d;pending.textContent=stripMd(acc2);msgs.scrollTop=msgs.scrollHeight;}
}catch(e){}
});
return pump();
});
}
return pump();
}).catch(function(err){
pending.textContent=(acc2?(acc2+'\n\n'):'')+'连接失败：'+err.message;
hint.textContent='请求失败，检查接口地址、Key 与 CORS';
}).then(function(){sendBtn.disabled=false;});
}
sendBtn.addEventListener('click',sendMsg);
ta.addEventListener('keydown',function(e){
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});

var msgs=document.getElementById('cs-bot-msgs');

var botBusy=false;
function bubble(role,text){

b.className='cs-bot-bubble'+(role==='user'?' u':'');
b.textContent=text;

function ensureHomeEngine(onProgress){
return new Promise(function(resolve,reject){
if(localEngine){resolve(localEngine);return;}
if(!navigator.gpu){reject(new Error('当前浏览器不支持 WebGPU，请用 Chrome / Edge 打开；或到「智能体广场」使用 API 模式对话'));return;}
if(!localLoading){initLocal(cfg.localModel,localStatus,startBtn,true);}
var n=0;
var timer=setInterval(function(){
n++;
if(onProgress&&localStatus&&localStatus.textContent){onProgress(localStatus.textContent);}
if(localEngine){clearInterval(timer);resolve(localEngine);return;}
if(!localLoading&&!localEngine){clearInterval(timer);reject(new Error(lastLocalError||'模型加载失败'));return;}
if(n>300){clearInterval(timer);reject(new Error('模型加载超时'));}
},500);
});
}
function askHome(){
var text=(input.value||'').trim();
if(!text||botBusy){return;}
botBusy=true;
input.value='';
homeHistory.push({role:'user',content:text});
bubble('user',text);
var pending=bubble('assistant','正在准备本地模型（首次需下载，之后会快很多）…');
var sys={role:'system',content:'你是「AI赋能计算机学子成才领航系统」的 AI 伙伴，面向大专计算机学生。你既能做专业规划，也能陪用户闲聊。当用户问专业、证书、竞赛、专升本、就业时，给出清晰、可执行的建议；当用户只是打招呼、聊天、吐槽、分享心情时，像朋友一样自然回应，先共情再交流，不要硬转成职业规划。用中文，控制在 200 字以内；纯文本，不要使用 Markdown；不确定的信息不要编造。'};
var payload=[sys].concat(homeHistory.slice(-8));
ensureHomeEngine(function(msg){pending.textContent=msg;}).then(function(engine){
pending.textContent='正在思考…';
return engine.chat.completions.create({messages:payload,temperature:0.6,stream:true,max_tokens:512}).then(function(chunks){
var acc='',it=chunks[Symbol.asyncIterator]();
function pump(){
return it.next().then(function(res){
if(res.done){
var out=stripMd(acc);
pending.textContent=out||'(模型没有返回内容)';
if(acc){homeHistory.push({role:'assistant',content:out});}
msgs.scrollTop=msgs.scrollHeight;
return;
}
var c=res.value;
var ch=c&&c.choices&&c.choices[0];
var d=ch&&ch.delta&&ch.delta.content;
if(d){acc+=d;pending.textContent=stripMd(acc);msgs.scrollTop=msgs.scrollHeight;}
return pump();
});
}
return pump();
});

}).then(function(){botBusy=false;});
}

}

}
function positionPanel(){
if(panel.hidden){return;}
var r=bot.getBoundingClientRect();
var w=panel.offsetWidth,h=panel.offsetHeight;
var left=Math.min(Math.max(12,r.right-w),window.innerWidth-w-12);
var top=r.top-h-12;
if(top<12){top=Math.min(window.innerHeight-h-12,r.bottom+12);}
if(top<12){top=12;}
panel.style.left=left+'px';
panel.style.top=top+'px';
}

try{var saved=localStorage.getItem(POS);if(saved){var p=JSON.parse(saved);if(p&&typeof p.left==='number'){bot.style.right='auto';bot.style.bottom='auto';bot.style.left=p.left+'px';bot.style.top=p.top+'px';}}}catch(e){}
var drag=false,moved=false,sx=0,sy=0,ox=0,oy=0;

drag=true;moved=false;sx=e.clientX;sy=e.clientY;
var r=bot.getBoundingClientRect();ox=r.left;oy=r.top;
try{bot.setPointerCapture(e.pointerId);}catch(err){}

});

var dx=e.clientX-sx,dy=e.clientY-sy;

var y=Math.min(Math.max(8,oy+dy),window.innerHeight-h-8);
bot.style.left=x+'px';bot.style.top=y+'px';bot.style.right='auto';bot.style.bottom='auto';
});
bot.addEventListener('pointerup',function(e){
if(!drag){return;}
drag=false;
try{bot.releasePointerCapture(e.pointerId);}catch(err){}
if(moved){
try{var r=bot.getBoundingClientRect();localStorage.setItem(POS,JSON.stringify({left:r.left,top:r.top}));}catch(err){}
positionPanel();
}else{
openBot();
}
});
