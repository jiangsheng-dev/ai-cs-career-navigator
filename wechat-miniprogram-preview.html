.screen .cd-label{font-size:10px;color:#8b95a5}

.switch.on::after{left:18px}

function pad(n){return n<10?'0'+n:''+n;}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtCN(d){return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function fmtTime(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function nextForMonth(month,kind,now){
  var day=kind==='报名'?1:15;
  var d=new Date(now.getFullYear(),month-1,day,9,0,0);
  if(d.getTime()<=now.getTime()) d=new Date(now.getFullYear()+1,month-1,day,9,0,0);
  return d;
}
function allNodes(item,now){
  now=now||new Date();
  var list=(item.dates||[]).map(function(n){
    var d=nextForMonth(n.month,n.kind,now);
    return {kind:n.kind,label:n.label,month:n.month,date:d,days:Math.max(0,Math.ceil((d.getTime()-now.getTime())/86400000))};
  });
  list.sort(function(a,b){return a.date-b.date;});
  return list;
}
function nextNode(item){var a=allNodes(item);return a.length?a[0]:null;}
function stars(n){var s='';for(var i=1;i<=5;i++){s+=(i<=n?'★':'☆');}return s;}
function findItem(id){for(var i=0;i<CATALOG.length;i++){if(CATALOG[i].id===id)return CATALOG[i];}return null;}
function read(key){try{var v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}
function write(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function goals(){return read(GK)||[];}

function todos(){return read(TK)||[];}

      }
    });
    write(GK,seedGoals);
  }
  if(reminders()===null){
    var c=null;
    for(var j=0;j<CATALOG.length;j++){if(CATALOG[j].name.indexOf('蓝桥杯大赛')===0){c=CATALOG[j];break;}}

    var txt=(state.todoText||'').trim();
    if(!txt){toast('先写点内容');return;}
    var tl=todos();tl.unshift({id:'t'+Date.now(),text:txt.slice(0,60),createdAt:Date.now()});write(TK,tl);
    state.todoText='';render(false);toast('已添加');return;
  }
  if(t.hasAttribute('data-done')){
    var tid=t.getAttribute('data-done');
    state.completing=tid;render(false);
    setTimeout(function(){
      write(TK,todos().filter(function(x){return x.id!==tid;}));
      state.completing=null;render(false);toast('已完成');
    },280);
    return;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='searchInput'){state.keyword=e.target.value;rerenderCatalogList();}
  if(e.target.id==='remindDate'){state.remindDate=e.target.value;}
  if(e.target.id==='remindTime'){state.remindTime=e.target.value;}
  if(e.target.id==='todoInput'){state.todoText=e.target.value;}
});
document.getElementById('navBack').addEventListener('click',function(){state.detailId=null;render(true);});
document.getElementById('resetDemo').addEventListener('click',function(){try{localStorage.removeItem(GK);localStorage.removeItem(RK);localStorage.removeItem(TK);localStorage.removeItem('wx_preview_todos_v1');}catch(e){}seed();state.detailId=null;state.tab='index';render(true);toast('已重置演示数据');});
seed();render(true);
</script>
</body>
</html>
